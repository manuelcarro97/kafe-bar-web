<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reservas del día – Kafé</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;600&display=swap" />
    <link rel="stylesheet" href="/css/plano.css" />
    <link rel="stylesheet" href="/reservas/reservas.css" />
    <link rel="stylesheet" href="/admin/reservas/reservas-admin.css" />
</head>
<body class="admin-mode">
    <section id="login" class="login" hidden>
        <form id="loginForm" class="login-box" autocomplete="on">
            <h1>Reservas de Kafé</h1>
            <p class="small">Inicia sesión con la cuenta del bar.</p>
            <label class="field">Correo electrónico<input id="loginEmail" name="email" type="email" required autocomplete="username"></label>
            <label class="field">Contraseña<input id="loginPassword" name="password" type="password" required autocomplete="current-password"></label>
            <button id="loginSubmit" class="primary" type="submit">Entrar</button>
            <p id="loginError" class="notice" role="alert" hidden></p>
        </form>
    </section>

    <section id="denied" class="login" hidden>
        <div class="login-box">
            <h1>Sin permiso</h1>
            <p class="notice">Esta cuenta no tiene permiso para gestionar las reservas.</p>
            <button id="deniedLogout" type="button">Cerrar sesión</button>
        </div>
    </section>

    <div id="app" class="wrap" hidden>
        <header>
            <h1>Reservas del día</h1>
            <div class="row">
                <a class="action" href="/admin/">Editor de contenido</a>
                <button id="logout" type="button">Cerrar sesión</button>
            </div>
        </header>
        <div class="legend">
            <span><i style="background:var(--free)"></i>Libre</span>
            <span><i style="background:var(--sel)"></i>Mesa marcada</span>
            <span><i style="background:var(--pending)"></i>Pendiente</span>
            <span><i style="background:var(--taken)"></i>Reservada</span>
        </div>
        <div class="stage">
            <svg id="plan"></svg>
            <section id="panel" class="panel" aria-live="polite"></section>
        </div>
    </div>

    <script type="module" src="/admin/reservas/reservas-admin.js"></script>
</body>
</html>
